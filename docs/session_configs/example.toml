# One of these per cot, prepared the day before. --location, --board and --subject are the only
# lines every campaign session needs; the rest can be left out and typed in the window instead.
#
# Launch with:  pythonw tools/pulsenest_recorder_gui.py --config docs/session_configs/subj01.toml
#
# FULL SUBSTITUTION: any of these fields typed on the command line alongside --config is refused,
# not merged, so the file is never silently overridden by a stray flag.

location  = "HOSP01"        # coded site, never a place name (pulsenest_recorder_spec.md section 11)
operator  = "AC"             # initials or role, never a full name
board     = "8850"           # last hex digits of this cot's board MAC (docs/boards.md)
subject   = "SUBJ01"         # coded subject, never a name
note      = "term neonate, resting after a feed"
# ^ free text, written verbatim as a NOTE event, AND its sanitised form seeds the starting
# CONDITION -- there is no separate "cond" field: a short, controlled word was not worth a launch
# parameter of its own. Correct CONDITION in the window at any time if the derived slug looks
# wrong or the baby's state simply changes.
probe     = "Medle-neo"      # OUR probe's physical model -- ISO 80601-2-61 calibrates the
# monitor+probe pair together, and the library cannot know which sensor is clipped onto the baby;
# only a person can. Not the same as [ref].probe-site below, which is the COMMERCIAL monitor's
# probe placement, and not the same as ProbeState (APPLIED/DISCONNECTED), which is real-time and
# comes from the firmware, not typed here.

# Everything about the ONE commercial monitor beside this baby -- including which phone is
# filming it, since a phone reads that same monitor's screen rather than being a separate fact.
# Every line here is optional; leave the table out entirely if there is no reference monitor.
[ref]
model      = "Masimo Radical-7"
avg        = 8                    # its averaging window, in seconds -- decides if the two SpO2 compare at all
probe-site = "left thumb"         # where ITS probe is, not ours -- as specific as the photo lets you be
videonest  = "J6plusACM"          # device id of the phone filming THIS monitor -- omit if none
